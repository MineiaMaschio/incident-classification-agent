name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install ruff
        run: pip install ruff>=0.8.0
      
      - name: Run ruff check
        run: ruff check src/ tests/ api/

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -e ".[dev]"
      
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  validate-config:
    runs-on: ubuntu-latest
    name: Validate Configuration
    steps:
      - uses: actions/checkout@v4
      
      - name: Check .env.example exists
        run: |
          if [ ! -f .env.example ]; then
            echo "Error: .env.example not found"
            exit 1
          fi
          echo "✓ .env.example found"
      
      - name: Check OLLAMA_MODEL in .env.example
        run: |
          if grep -q "OLLAMA_MODEL" .env.example; then
            echo "✓ OLLAMA_MODEL found in .env.example"
          else
            echo "Error: OLLAMA_MODEL not found in .env.example"
            exit 1
          fi
      
      - name: Check RESIDENTS_API_URL in .env.example
        run: |
          if grep -q "RESIDENTS_API_URL" .env.example; then
            echo "✓ RESIDENTS_API_URL found in .env.example"
          else
            echo "Error: RESIDENTS_API_URL not found in .env.example"
            exit 1
          fi
